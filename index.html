<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCafe v2 - HTML Editor with File Controls</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
        .textarea-editor {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            resize: none;
        }
    </style>
</head>
<body class="bg-zinc-900 text-zinc-100 flex flex-col h-screen">

    <!-- Top Navigation Bar -->
    <header class="h-14 border-b border-zinc-800 bg-zinc-950 flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-lg font-semibold tracking-tight text-zinc-200">☕ WebCafe <span class="text-xs font-normal text-zinc-500 ml-1">v2.0</span></h1>
        </div>
        
        <!-- Document Operations Toolbar -->
        <div class="flex items-center gap-2">
            <!-- Hidden native file input element accessed via custom button label -->
            <input type="file" id="fileInput" accept=".html,.htm,.txt" class="hidden">
            <button id="importBtn" class="px-3 py-1.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-700 text-zinc-200 rounded-md border border-zinc-700 transition duration-150 flex items-center gap-1.5 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                Import HTML
            </button>
            
            <button id="exportBtn" class="px-3 py-1.5 text-xs font-medium bg-zinc-800 hover:bg-zinc-700 active:bg-zinc-700 text-zinc-200 rounded-md border border-zinc-700 transition duration-150 flex items-center gap-1.5 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                Export / Download
            </button>

            <div class="h-6 w-px bg-zinc-800 mx-1"></div>

            <button id="shareBtn" class="px-3 py-1.5 text-xs font-medium bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white rounded-md transition duration-150 flex items-center gap-1.5 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
                Get Hosting Link
            </button>
            
            <button id="resetBtn" class="px-3 py-1.5 text-xs font-medium bg-red-950/40 hover:bg-red-900/40 text-red-400 rounded-md border border-red-900/50 transition duration-150 cursor-pointer">
                Clear
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex flex-1 overflow-hidden divide-x divide-zinc-800">
        
        <!-- Left Side: Code Editor -->
        <div class="w-1/2 h-full flex flex-col relative bg-zinc-950">
            <div class="h-8 bg-zinc-900/50 border-b border-zinc-800/80 px-4 flex items-center justify-between text-xs text-zinc-400 tracking-wider font-mono">
                <span id="fileNameLabel">INDEX.HTML</span>
                <span id="charCount">0 chars</span>
            </div>
            <textarea id="editor" class="textarea-editor w-full flex-1 p-4 bg-zinc-950 text-emerald-400 focus:outline-none text-sm leading-relaxed" spellcheck="false" placeholder="Write your HTML, CSS, or JS here..."></textarea>
        </div>

        <!-- Right Side: Live Iframe Preview -->
        <div class="w-1/2 h-full flex flex-col bg-white">
            <div class="h-8 bg-zinc-100 border-b border-zinc-200 px-4 flex items-center justify-between text-xs text-zinc-500 tracking-wider font-mono">
                <span>LIVE PREVIEW</span>
                <span id="previewStatus" class="text-emerald-600 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Idle
                </span>
            </div>
            <iframe id="preview" class="w-full flex-1 border-none bg-white" sandbox="allow-scripts allow-modals allow-popups"></iframe>
        </div>
    </main>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 bg-zinc-800 text-zinc-200 rounded-lg shadow-xl border border-zinc-700 text-sm transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- Script Application Logic -->
    <script src="app.js"></script>
</body>
</html>
